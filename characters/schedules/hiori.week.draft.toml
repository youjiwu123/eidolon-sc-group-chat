# 風野灯織的一周作息 × 地点草案（pilot 批次，先别接进代码）。
#
# 证据 vs 推断（口径同 schedules.mano.week.draft.toml）：
#   - 证据：characters/schedules/hiori.stats.json 的地点分布与时间信号、
#     characters/facts/hiori.md、characters/sheets/hiori.md。
#     例：事务所休息室 23.7%（1,936 句，全部场景最高）、卧室 6.4%、十字路口 4.6%、
#     练习室 4.3%、公园 3.8%、咖啡店 3.1%，工作 34.9% / 街上 26.7% / 家 9.5% / 学校 3.3%。
#     语境信号：工作 10.7% / 练习 5.6% / 吃饭 5.4% / 夜 3.0% / 通勤 2.3% / 学校 1.9% / 朝 1.6%。
#   - 推断：原作没有时钟也没有星期几。周一周三周五上学 + 练习、周二收录、周四休息跑腿、
#     周六工作、周日休息，是照「高一学生 + 偶像工作」排的；学校占比在语料里只有 3.3%
#     （见 schedules.stats.md「语料本身的偏向」），所以学校是按学历推断补的，`why` 里写「推断」。
#   - 注意：休息室 23.7% 不能直接当作息——00001 是通用对话背景（见 stats 的 caveat），
#     这里把它拆成「工作日的落点」：一早碰头、收工、被叫去开会，而不是让她整天坐沙发。
#   - 2026-10 追加：`[[pools]]` 把不在固定槽位里的 39 个日常场景接进来（chance 0.18），
#     `[[holidays]]` 只覆盖与共享日历/真乃 不同的 12 个节日（其余回落到 characters/holidays.toml），
#     `[[events]]` 14 条，带 conditions 和演出/季节/生病专用场景。
#     一次通话的顺序：节日覆盖 > 事件 > 固定槽位 > 随机池。字段含义见 characters/schedules.model.md。

