#
# 证据 vs 推断（口径同 schedules.mano.week.draft.toml）：
#   - 证据：characters/schedules/toru.stats.json、characters/facts/toru.md、characters/sheets/toru.md。
#     例：卧室 10.2%（619 句，相对偏好 ×3.7）、休息室 9.9%、住宅街 2.8%、公园 2.5%、
#     后台 2.4%、教室 2.2%、练习室 2.2%、学校走廊 1.9%（×3.2）、商店街 1.9%、
#     天台 1.4%（×3.4）、图书室 0.6%…结构是工作 18.2% / 学校 7.2% / 街上 20.9% / 家 11.7% /
#     其他 42.0%，**「其他」是 27 人里最高的**——她的一天本来就不集中在某几个地方。
#   - 推断：原作没有时钟也没有星期几。她是高二（2 年 4 组），平日上午上课、下午有收录或练习，
#     周四是「没有工作的日子」，周六是工作、周日睡到下午——这套排法是照「高中生 + 偶像」补的，
#     学校占 7.2% 已经是这批人里最高的（stats 说校园场景在语料里只有 2–6%），
#     所以学校场景反而可以放心多排一点。
#   - 她的固定槽位刻意排得「散」：卧室、住宅街、天台、河堤、展望台、洗衣店、便利店都进去，
#     这是数据说的（卧室 10.2% / 休息室 9.9%，没有一个是 20% 以上的「枢纽」），
#     不是把真乃的周表换个地点。
#   - 2026-10 追加：`[[pools]]` 把不在固定槽位里的 41 个日常场景接进来（chance 0.18），
#     `[[holidays]]` 只覆盖与共享日历/真乃 不同的 11 个节日（其余回落到 characters/holidays.toml），
#     `[[events]]` 13 条。一次通话的顺序：节日覆盖 > 事件 > 固定槽位 > 随机池。

