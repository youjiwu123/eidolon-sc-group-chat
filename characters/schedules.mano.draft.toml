# 真乃的作息草案（从剧情挖出来的），先别接进代码。
#
# 这不是产品文件，是给你过目的草稿。字段含义先按下面这套理解，定稿要接进代码时再改：
#   - weight：同一时段内的相对权重（越大越常发生），不是概率；一个时段内按 weight 归一化。
#   - 时段：morning(6-10) / noon(10-14) / afternoon(14-18) / evening(18-22) / night(22-2)
#   - scene 只能用 scenes.toml 里的 7 个 id：lounge / studio / park / beach / home / train / sky
#     （sky = 「说不准」，外景兜底）
#
# 证据从哪来（按可信度从高到低）：
#   1. 剧情台词归因：她的 7,299 句台词，按逐步骤继承的 bg 归到场景，数出占比。
#      详见 .scratch/schedule/bg_table.md（bg → 台词数 → 场景）。
#   2. 同一批台词里的时间词：对她每句台词的 ±2 句上下文搜 朝/おはよう/夜/レッスン 等，
#      看「哪个场景的话里集中出现哪个时段」。
#   3. 人设与档案（characters/sheets/mano.md、facts/mano.md）：习惯、喜好、家人、ピーちゃん。
#   4. corpus/small-talk/mano/lines.json：77 句，但这个文件的 period 字段 77 句全是 "all"，
#      没有时段信息，只能用内容（只有 2 句おはよう）。
#
# 重要：下面的 weight 不是直接把台词占比抄下来。台词占比量的是「剧情在哪发生」，
# 不是「她一天怎么过时间」——事务所是剧情枢纽，所以休息室占 18.3%，这不代表她一天有
# 18% 的时间待在休息室。weight 是我拿「台词占比 + 时间词 + 人设」三样调的判断，
# 更偏日常时间预算，不是统计值。
#
# 另外：学校（体育馆 00248、操场 00648，合计 0.9%）和商店街/餐厅/舞台/神社/河边这些
# 都没有对应 scene id，下面 weekday 上学的时间段用 sky（说不准）占位，别硬塞进别的场景。

# ---------------------------------------------------------------------------
# 工作日
# ---------------------------------------------------------------------------

