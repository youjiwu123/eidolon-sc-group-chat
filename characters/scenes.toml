# 通话场景。接通电话时她身后那张背景（DESIGN.md「通话场景」）。
#
# 场景是下面这些日常的地方（事务所、练习室、街上、学校、店里……）：判断模型只能从 `name` 里挑，
# 挑不出来就用「说不准」那一条（外景天空），随机挑不到就落到 `[behaviors]` 的第一条。
# 图放在 `characters/scenes/<image>`，由后端 `/api/scenes/<id>` 送出（和头像、通话背景一样带 ETag）。
#
# `hint` 是给判断模型看的辨识依据，不显示给用户。

