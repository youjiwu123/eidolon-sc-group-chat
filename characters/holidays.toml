# 日本日历（部署时区 Asia/Tokyo）：公休 + 会改她一天的季节行事。
#
# 这份文件只回答三件事：**哪天是什么日子**、**这天适合去哪**、**她会说什么**。
# 「这天到底走不走节日支线」是排期文件的事（characters/schedules.mano.week.draft.toml 的
# `[[holidays]]`），优先级、时段、概率都在那边；这里不做选择，只给日历和气氛。
# 字段含义见 characters/schedules.model.md。
#
# 日期来源（2026-10-26 核对）：
#   - 公休：内閣府「国民の祝日」CSV https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv
#     2026 年 18 天、2027 年 17 天（都含振替休日 / 国民の休日）。
#   - 春分の日 / 秋分の日：国立天文台「暦要項」 https://www.nao.ac.jp/news/topics/2025/20250203-rekiyoko.html
#     2026 = 3/20・9/23，2027 = 3/21・9/23。
#   - 振替休日 / 国民の休日 取 CSV 里标「休日」的那几天，理由写在各条 `note` 里。
#
# **一年一校**：内阁府每年 2 月公布次年祝日、国立天文台同期公布次年暦要項。
# 部署跨到 2028 年之前（`[calendar].next_review`）要把两年份补进来；
# 补完跑 `.scratch/schedule/simulate.py`，它会打印没被任何 `[[holidays]]` 覆盖的日期。
#
# `scenes` 里的 id 必须存在于 characters/scenes.toml（84 条，校验脚本会断言）。
# `weights` 与 `scenes` 等长，省略时全为 1。
# 季节行事的日期每年浮动（樱花、红叶、夏祭り），`note` 里写了这是推断，需要每年对一次实际开花/开催日。

[calendar]
timezone = "Asia/Tokyo"
years = [2026, 2027]
verified_on = "2026-10-26"
next_review = "2027-02"
sources = [
  "https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv",
  "https://www.nao.ac.jp/news/topics/2025/20250203-rekiyoko.html",
]

