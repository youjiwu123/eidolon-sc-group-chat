# ===========================================================================
# 随机池（daily-life 场景）—— 让剩下的日常地点也能被抽到
# ===========================================================================
#
# 固定槽位只用到 34 个场景（32 个日常 + stage/backstage），池子把**不在固定槽位里的 37 个日常
# 场景**接进来：先按作息/日历/事件决定这一格该在哪，池子再按 `chance` 中签，中签就换成池子里
# 的一个地点。所以池子只放「日常地点」——演出、宴会、机场、保龄球、酒吧、居酒屋、季节限定都不放，
# 它们只在 `[[events]]` 或 `[[holidays]]` 里出现。
#
# 不进池子的 14 个（事件/节日专用，理由见 characters/schedules.model.md）：
#   stage / backstage              演出（stage 在周六下午、backstage 在周六中午的固定槽位里）
#   banquet                        宴会厅：打ち上げ、圣诞会
#   beach                          海边：要出远门（夏日事件 + 海の日）
#   flower_field / cherry / ginkgo 季节限定（山の日 / 花見 / 紅葉狩り）
#   hospital_corridor / exam_room  生病（冬天事件）
#   hall                           礼堂：学园祭/合唱祭（文化の日）
#   izakaya / bar                  未成年，只在忘年会事件里露个面（喝ウーロン茶）
#   airport                        出远门
#   bowling                        要专门约
# `sky`（说不准）是判断模型挑不出来时的兜底，不是「地点」，也不进池子。
# 37 + 32 = 69 个日常场景，一个不落；校验脚本会断言这件事。
#
# 多个池子同时命中时，`slot` 更具体的优先（夜里的 `slot = "night"` 池压过 `slot = "any"` 池）。

