# ---------------------------------------------------------------------------
# 突发事件（chance 是每次通话命中这个事件的概率，不是占比；文件顺序就是优先级）
# ---------------------------------------------------------------------------
#
# `conditions` 是闸门：全部条件都命中才轮到 roll `chance`，不写就是不设限。
# 键：season（spring/summer/autumn/winter）、weather（clear/cloudy/rain/snow）、
#     holiday（characters/holidays.toml 的 id）、weekday（weekday/weekend）、slot（五个时段）。
# 值可以是单值也可以是数组（命中任一即可）。
# 节日专属的事件排在最前面（夏祭り的花火）；其余按「日常 → 季节」排——前面的先吃掉机会，
# 罕见事件才显得罕见，所以越靠后越少出现。
#
# 三个无条件事件（studio 0.10→0.055 / lounge 0.08→0.045 / train 0.06→0.03）都缩到原来的
# 一半上下：它们排在最前面，原先吃掉太多机会，全年事件命中率 36.3%；压下来之后约 29.8%
# （每天五次通话里约 1.5 次由事件决定，其余按作息和池子走）。数字由 .scratch/schedule/simulate.py 复核。

[[events]]
character = "mano"
chance = 0.10
scene = "river"
activity = "夏祭り的晚上，她在河堤上被人流推着走，花火升起来的时候忘了说话"
conditions = { holiday = "natsumatsuri", slot = ["evening", "night"] }
why = "夏祭り/花火大会 是夏天最像「她的一天被打断」的日子；花火落在河堤是因为 00258/00265 的河堤有黄昏与夜版，且她本来就常在河边散步（档案）"

