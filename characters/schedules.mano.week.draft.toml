# 真乃的一周作息 × 地点草案（接在 schedules.mano.draft.toml 后面，先别接进代码）。
#
# 证据 vs 推断：
#   - 证据：剧情台词按 bg 归到场景的计数（.scratch/schedule/bg_table.md、digest.md）、
#     台词里的时间词、人设 characters/sheets/mano.md、档案 characters/facts/mano.md。
#     例：练习室台词 24.2% 带レッスン/練習、休息室占 18.3%、学校 bg 只有 0.9%、
#     电车台词早晚两头都带时间词、00034 里她提过「駅前に新しいお店」。
#   - 推断：原作没有时钟，脚本里也没有星期几。day 的分配（周一周三周五上学+练习、周二收录、
#     周四休息跑腿、周六工作、周日休息）是照「高一学生 + 偶像工作」排的；每个 slot 的
#     activity、weight 是推断，`why` 里写了「推断」的就是没有直接出处。
#   - 合并后的 84 个场景让学校、商店街、超市、河堤、公寓这些地方终于有 id 可用；
#     地点对得上，但「哪一天去」仍然是推断。night 是 22-2 点，会跨到第二天。
#   - 2026-10 追加（本文件后半部分）：`[[pools]]` 随机池把不在固定槽位的 37 个日常场景接进来，
#     `[[holidays]]` 让日本日历改她的一天（日历本体在 characters/holidays.toml），
#     `[[events]]` 从 8 条扩到 17 条并加了 `conditions`。
#     一次通话的选择顺序是：节日覆盖 > 事件（条件命中才 roll）> 固定槽位（按 weight）
#     > 随机池（按 chance 覆盖槽位）。字段含义见 characters/schedules.model.md。

