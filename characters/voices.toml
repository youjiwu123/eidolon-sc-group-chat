audio = "voices/luca/s61_10126001_00_0020.mp3"
seconds = 1.92
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126001_00"
line = "0040"
text = "…………"
subtitle = "…………"
audio = "voices/luca/s61_10126001_00_0040.mp3"
seconds = 1.15
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126001_00"
line = "0050"
text = "ふーん"
subtitle = "哼——"
audio = "voices/luca/s61_10126001_00_0050.mp3"
seconds = 1.51
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126002_00"
line = "0020"
text = "あ？　なんでオメェなんかと"
subtitle = "哈？　凭什么要跟你去"
audio = "voices/luca/s61_10126002_00_0020.mp3"
seconds = 3.19
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126002_00"
line = "0040"
text = "……図々しい"
subtitle = "……脸皮真厚"
audio = "voices/luca/s61_10126002_00_0040.mp3"
seconds = 2.66
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126002_00"
line = "0060"
text = "冗談\nパイ投げ会場の間違いだろ"
subtitle = "开玩笑\n你走错地方了吧，那边是扔派大会的会场"
audio = "voices/luca/s61_10126002_00_0060.mp3"
seconds = 3.26
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126003_00"
line = "0010"
text = "いつもありがとう、これ……プレゼント……\n喜んでくれるかわかんないけど────"
subtitle = ""
audio = "voices/luca/s61_10126003_00_0010.mp3"
seconds = 8.64
kind = "birthday"

[[line]]
character = "luca"
story = "s61_10126003_00"
line = "0040"
text = "こんなもん落ちてたら危ねェだろ……"
subtitle = ""
audio = "voices/luca/s61_10126003_00_0040.mp3"
seconds = 2.86
kind = "birthday"

[[line]]
character = "hana"
story = "s02_03270000_02"
line = "0120"
text = "あたしは……\nできれば、レッスンも行きたいかな"
subtitle = "我嘛……\n如果可以的话，还是想去训练"
audio = "voices/hana/s02_03270000_02_0120.mp3"
seconds = 5.35
kind = "quote"

[[line]]
character = "hana"
story = "s20_12600100_01"
line = "0100"
text = "はるきちゃん、\nルカちゃんの広告と一緒に写真撮ろーっ"
subtitle = "阳希，跟路加的广告牌一起拍张照吧！"
audio = "voices/hana/s20_12600100_01_0100.mp3"
seconds = 3.24
kind = "quote"

[[line]]
character = "hana"
story = "s42_01250100_04"
line = "0020"
text = "ふふ、美味しそうっ"
subtitle = ""
audio = "voices/hana/s42_01250100_04_0020.mp3"
seconds = 2.23
kind = "quote"

[[line]]
character = "hana"
story = "s61_10127001_00"
line = "0010"
text = "プロデューサー、今日は特別な日だね"
subtitle = "制作人，今天是特别的日子呢"
audio = "voices/hana/s61_10127001_00_0010.mp3"
seconds = 4.32
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127001_00"
line = "0030"
text = "もーっ、プロデューサーの誕生日でしょ？\nあたし、すっごく楽しみにしてたんだよ"
subtitle = "真是的——，是制作人的生日吧？\n我可是一直超级期待的呢"
audio = "voices/hana/s61_10127001_00_0030.mp3"
seconds = 7.01
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127001_00"
line = "0040"
text = "プロデューサーが、今までで一番思い出に残る\n誕生日にできたらいいなーって思ってるの、ふふっ"
subtitle = "我想让今天成为制作人\n有生以来最难忘的一个生日，呵呵"
audio = "voices/hana/s61_10127001_00_0040.mp3"
seconds = 6.77
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127002_00"
line = "0010"
text = "あ、プロデューサーやっと来たーっ\nあたし、会いたくて待ってたんだよ？"
subtitle = "啊，制作人你终于来了——\n我一直在等着见你呢？"
audio = "voices/hana/s61_10127002_00_0010.mp3"
seconds = 6.65
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127002_00"
line = "0030"
text = "ふふっ──！\nううん、大丈夫"
subtitle = "呵呵——！\n没事没事"
audio = "voices/hana/s61_10127002_00_0030.mp3"
seconds = 2.71
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127002_00"
line = "0040"
text = "誕生日おめでとうっ\n一緒にいい日にしようね？"
subtitle = "生日快乐\n一起度过美好的一天吧？"
audio = "voices/hana/s61_10127002_00_0040.mp3"
seconds = 3.94
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127003_00"
line = "0020"
text = "プロデューサーが\n楽しそうって言ってたなーって思って"
subtitle = ""
audio = "voices/hana/s61_10127003_00_0020.mp3"
seconds = 3.98
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127003_00"
line = "0040"
text = "あはっ\n喜んでもらえてよかったー"
subtitle = ""
audio = "voices/hana/s61_10127003_00_0040.mp3"
seconds = 3.58
kind = "birthday"

[[line]]
character = "hana"
story = "s61_10127003_00"
line = "0050"
text = "思い出\n一緒に作りに行こうねっ──！"
subtitle = ""
audio = "voices/hana/s61_10127003_00_0050.mp3"
seconds = 3.48
kind = "birthday"

[[line]]
character = "haruki"
story = "s09_01012800_01"
line = "0090"
text = "なので、まずはプロデューサーさんと\n相談してからと思いまして……！"
subtitle = "所以，我想先跟制作人商量一下……！"
audio = "voices/haruki/s09_01012800_01_0090.mp3"
seconds = 6.02
kind = "quote"

[[line]]
character = "haruki"
story = "s20_12600100_01"
line = "0090"
text = "わぁ……！　すっごくおっきいねぇ……！\nかっこいい～！"
subtitle = "哇……！好大好气派啊……！\n好帅～！"
audio = "voices/haruki/s20_12600100_01_0090.mp3"
seconds = 6.94
kind = "quote"

[[line]]
character = "haruki"
story = "s42_01080100_01"
line = "0100"
text = "ふふ、そうだねぇ"
subtitle = "呵呵，好呀。"
audio = "voices/haruki/s42_01080100_01_0100.mp3"
seconds = 3.62
kind = "quote"

[[line]]
character = "haruki"
story = "s44_01280101_00"
line = "0390"
text = "すごく、すごく勇気をもらいました！\nそれに……ふふ、ありがとうございます────では"
subtitle = ""
audio = "voices/haruki/s44_01280101_00_0390.mp3"
seconds = 11.18
kind = "quote"

[[line]]
character = "haruki"
story = "s61_10128002_00"
line = "0030"
text = "ふふ～、もちろんですよ……！\n何日も前からそわそわしてました……！"
subtitle = "呵呵～，那当然啦……！\n我好几天前就开始坐立不安了呢……！"
audio = "voices/haruki/s61_10128002_00_0030.mp3"
seconds = 7.20
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128001_00"
line = "0010"
text = "プロデューサーさん……！\n今日、会いたかったです……！"
subtitle = "制作人……！\n今天，我一直想见到您……！"
audio = "voices/haruki/s61_10128001_00_0010.mp3"
seconds = 4.22
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128001_00"
line = "0030"
text = "えへへ、だって今日はプロデューサーさんの\nお誕生日ですから……！　おめでとうございます！"
subtitle = "嘿嘿，因为今天是制作人的\n生日嘛……！　生日快乐！"
audio = "voices/haruki/s61_10128001_00_0030.mp3"
seconds = 9.91
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128001_00"
line = "0040"
text = "今日はとっても偉大な日ですねぇ\n世界中を祝日にしてもいいと思います……！"
subtitle = "今天可是非常伟大的日子呢\n我觉得就算把全世界都定为节假日也不为过……！"
audio = "voices/haruki/s61_10128001_00_0040.mp3"
seconds = 9.96
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128002_00"
line = "0010"
text = "プロデューサーさん、今日はお誕生日ですよね……！\nおめでとうございます"
subtitle = "制作人，今天是您的生日对吧……！\n生日快乐"
audio = "voices/haruki/s61_10128002_00_0010.mp3"
seconds = 7.15
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128002_00"
line = "0040"
text = "これからいろんなことがあると思いますけど、わたしは\nいつも、プロデューサーさんの力になりたいって思います"
subtitle = "今后可能会有各种各样的事情，但我\n一直都想成为制作人的力量"
audio = "voices/haruki/s61_10128002_00_0040.mp3"
seconds = 9.62
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128002_00"
line = "0050"
text = "それだけは、\n心のどこか片隅に置いておいてほしいです……！"
subtitle = "这一点，\n希望您能放在心里的某个角落……！"
audio = "voices/haruki/s61_10128002_00_0050.mp3"
seconds = 5.52
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128003_00"
line = "0020"
text = "はい……！"
subtitle = ""
audio = "voices/haruki/s61_10128003_00_0020.mp3"
seconds = 0.74
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128003_00"
line = "0030"
text = "プロデューサーさん、\nいつもお忙しくされているので──"
subtitle = ""
audio = "voices/haruki/s61_10128003_00_0030.mp3"
seconds = 4.22
kind = "birthday"

[[line]]
character = "haruki"
story = "s61_10128003_00"
line = "0040"
text = "──たまにはゆっくりコーヒーや紅茶を飲んで\n休憩してもらいたいなぁって思いまして"
subtitle = ""
audio = "voices/haruki/s61_10128003_00_0040.mp3"
seconds = 6.84
kind = "birthday"

[[line]]
character = "hazuki"
story = "s07_90000000_03"
line = "0010"
text = "ごめんなさい\n今日はおやつ、無いんです～……"
subtitle = "对不起\n今天没有点心～……"
audio = "voices/hazuki/s07_90000000_03_0010.mp3"
seconds = 4.94
kind = "quote"

[[line]]
character = "hazuki"
story = "s07_90000000_07"
line = "0010"
text = "交通費と経費の申請、\n忘れずにお願いしますね～？"
subtitle = "交通费和经费的申请，\n请别忘了哦～？"
audio = "voices/hazuki/s07_90000000_07_0010.mp3"
seconds = 5.23
kind = "quote"

[[line]]
character = "hazuki"
story = "s20_29000100_01"
line = "0020"
text = "頼まれていた資料です♪"
subtitle = "您要的资料♪"
audio = "voices/hazuki/s20_29000100_01_0020.mp3"
seconds = 1.75
kind = "quote"

[[line]]
character = "hazuki"
story = "s20_29000100_01"
line = "0100"
text = "ふふっ\nそれはお互い様ですよ～"
subtitle = "呵呵\n彼此彼此啦～"
audio = "voices/hazuki/s20_29000100_01_0100.mp3"
seconds = 5.35
kind = "quote"

[[line]]
character = "hazuki"
story = "s42_01010300_06"
line = "0120"
text = "というわけで、お誘いお待ちしていますね～\nなんて～……"
subtitle = "那么，我就等着您的邀请了～\n开玩笑的～……"
audio = "voices/hazuki/s42_01010300_06_0120.mp3"
seconds = 9.38
kind = "quote"

[[line]]
character = "hazuki"
story = "s43_04010000_01"
line = "0010"
text = "プロデューサーさん\nおかえりなさい～"
subtitle = "制作人\n欢迎回来～"
audio = "voices/hazuki/s43_04010000_01_0010.mp3"
seconds = 3.29
kind = "quote"

[[line]]
character = "hazuki"
story = "s44_01260101_00"
line = "0030"
text = "大丈夫でしょうか……\n大規模なオーディションイベントですし……"
subtitle = ""
audio = "voices/hazuki/s44_01260101_00_0030.mp3"
seconds = 5.76
kind = "quote"

[[line]]
character = "hazuki"
story = "s80_01020000_00"
line = "0100"
text = "ふふっ\nライブ、大成功でしたね……！"
subtitle = "呵呵\n演唱会，大成功呢……！"
audio = "voices/hazuki/s80_01020000_00_0100.mp3"
seconds = 5.11
kind = "quote"

[[line]]
character = "hazuki"
story = "s61_10290001_00"
line = "0020"
text = "あ、そういえば……\nそうだったかもしれません～"
subtitle = "啊，说起来……\n好像确实是呢～"
audio = "voices/hazuki/s61_10290001_00_0020.mp3"
seconds = 5.66
kind = "birthday"

[[line]]
character = "hazuki"
story = "s61_10290001_00"
line = "0030"
text = "ふふ、覚えていてくださってありがとうございます\nプロデューサーさん……♪"
subtitle = "呵呵，谢谢您记得\n制作人……♪"
audio = "voices/hazuki/s61_10290001_00_0030.mp3"
seconds = 7.13
kind = "birthday"

[[line]]
character = "hazuki"
story = "s61_10290002_00"
line = "0020"
text = "ふふ、ありがとうございます♪\nじゃあ、素敵な一年にできるように……"
subtitle = "呵呵，谢谢您♪\n那么，为了能度过美好的一年……"
audio = "voices/hazuki/s61_10290002_00_0020.mp3"
seconds = 8.86
kind = "birthday"

[[line]]
character = "hazuki"
story = "s61_10290002_00"
line = "0030"
text = "領収書の提出、早めにお願いしますね～"
subtitle = "收据的提交，请尽早哦～"
audio = "voices/hazuki/s61_10290002_00_0030.mp3"
seconds = 5.11
kind = "birthday"

[[line]]
character = "hazuki"
story = "s61_10290003_00"
line = "0010"
text = "社長、失礼します～\nご用事ってなんでしょうか～"
subtitle = ""
audio = "voices/hazuki/s61_10290003_00_0010.mp3"
seconds = 7.13
kind = "birthday"

[[line]]
character = "hazuki"
story = "s61_10290003_00"
line = "0060"
text = "ありがとうございます……\nふふっ、覚えていてくださったんですね"
subtitle = ""
audio = "voices/hazuki/s61_10290003_00_0060.mp3"
seconds = 10.34
kind = "birthday"
